services:
  - type: web
    name: masquerade-groq-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PUBLIC_MODEL_NAME
        value: masquerade-groq-chatbot
      - key: JUDGE_API_KEY
        generateValue: true
